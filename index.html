    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #F6F8FA;
      --surface:      #FFFFFF;
      --card:         #FFFFFF;
      --card-hover:   #FAFAFC;
      --accent:       #E65100;
      --accent-hover: #BF3600;
      --accent-soft:  rgba(230, 81, 0, 0.04);
      --accent-glow:  rgba(230, 81, 0, 0.15);
      --text:         #1F2937;
      --muted:        #6B7280;
      --border:       #E5E7EB;
      --border-hover: rgba(230, 81, 0, 0.3);
      --radius-lg:    24px;

      --whatsapp:     #128C7E;
      --telegram:     #1F75A8;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ========================================== NAVIGATION */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      transition: all 0.3s ease;
      background: rgba(246, 248, 250, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid transparent;
    }

    header.scrolled {
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .nav-container {
      max-width: 1300px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 40px;
      transition: padding 0.3s ease;
    }

    header.scrolled .nav-container { padding: 18px 40px; }

    .logo {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      color: var(--text); text-decoration: none;
    }

    .logo em { color: var(--accent); font-style: normal; }

    .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }

      color: var(--muted); text-decoration: none; transition: color 0.2s ease;
      position: relative; padding: 4px 0;
    }

    .nav-links a:hover { color: var(--text); }
